<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ingresar · m23</title>
<style>
:root{--bg:#fff;--bg-soft:#f8fafc;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--grad:linear-gradient(135deg,#2563eb,#0ea5e9,#06b6d4);--font:system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--font);background:var(--bg-soft);color:var(--text);min-height:100vh;display:grid;place-items:center}
.card{width:100%;max-width:400px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:28px 24px;margin:24px;box-shadow:0 4px 24px rgba(15,23,42,.06)}
.logo-top{text-align:center;margin-bottom:12px}
h1{text-align:center;font-size:1.35rem;margin-bottom:20px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.social{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.btn-social{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;border-radius:10px;border:1px solid var(--border);background:#fff;font-weight:600;font-size:.9rem;cursor:pointer;color:var(--text)}
.btn-social:hover{background:var(--bg-soft)}
.btn-apple{background:#0f172a;color:#fff;border-color:#0f172a}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.8rem;margin:8px 0 14px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:6px}
input[type=email],input[type=password]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--border);margin-bottom:12px;font-size:.95rem;outline:none}
input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:.82rem}
.btn{width:100%;padding:12px;background:var(--grad);color:#fff;border:none;border-radius:10px;font-weight:650;font-size:.95rem;cursor:pointer}
.demo{margin-top:18px;padding-top:16px;border-top:1px solid var(--border);font-size:.8rem;color:var(--muted);text-align:center}
.demo a{margin:0 6px;color:var(--blue)}
</style>
</head>
<body>
<div class="card">
  <div class="logo-top"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 36" width="150" height="34" aria-label="m23"><defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2563eb"/><stop offset="50%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient></defs><g fill="url(#mg)"><path d="M2 6h28l-4 24H0z"/><path d="M34 6h28l-4 24H30z" opacity=".9"/><path d="M66 6h28l-4 24H62z" opacity=".75"/><path d="M98 6h28l-4 24H94z" opacity=".6"/><path d="M130 6h28l-4 24H126z" opacity=".5"/></g></svg></div>
  <h1>Ingresar</h1>
  <div class="social">
    <button class="btn-social" type="button" onclick="location.href='super-admin.html'">Continuar con Google</button>
    <button class="btn-social btn-apple" type="button" onclick="location.href='restaurant-admin.html'">Continuar con Apple</button>
  </div>
  <div class="divider">o con tu correo</div>
  <form onsubmit="event.preventDefault();location.href='restaurant-admin.html'">
    <label for="email">Correo electrónico</label>
    <input id="email" type="email" placeholder="tu@email.com" required/>
    <label for="password">Contraseña</label>
    <input id="password" type="password" placeholder="••••••••" required/>
    <div class="row"><label style="display:flex;gap:6px;align-items:center;margin:0;font-weight:500;color:var(--text)"><input type="checkbox"/> Recordarme</label><a href="#">¿Olvidaste tu contraseña?</a></div>
    <button class="btn" type="submit">Ingresar con correo</button>
  </form>
  <p style="text-align:center;margin-top:16px;font-size:.82rem;color:var(--muted)">¿No tienes cuenta? <a href="#">Regístrate con email</a></p>
  <div class="demo">Demo: <a href="super-admin.html">Super Admin</a> · <a href="restaurant-admin.html">Admin local</a> · <a href="menu-koke-pollo.html">Menú público</a></div>
</div>
</body>
</html>
