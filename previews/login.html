<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresar · m23</title>
  <style>
    :root {
      --bg: #0a1628;
      --surface: #0f2137;
      --border: #1e3a5f;
      --text: #f0f9ff;
      --muted: #94a3b8;
      --blue: #2563eb;
      --blue-bright: #3b82f6;
      --cyan: #06b6d4;
      --cyan-soft: #22d3ee;
      --gradient: linear-gradient(135deg, #2563eb 0%, #0ea5e9 50%, #06b6d4 100%);
      --radius: 12px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background-image:
        radial-gradient(ellipse 90% 60% at 50% -15%, rgba(37, 99, 235, 0.28), transparent 55%),
        radial-gradient(ellipse 60% 40% at 90% 90%, rgba(6, 182, 212, 0.12), transparent 50%);
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 28px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.55);
    }
    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }
    .logo-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .logo-box img {
      height: 48px;
      width: auto;
      display: block;
    }
    h1 {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 28px;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .social {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    .btn-social {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: #0a1628;
      color: var(--text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-social:hover {
      background: #12263f;
      border-color: #2d4a6f;
    }
    .btn-social svg { width: 20px; height: 20px; flex-shrink: 0; }
    .btn-apple {
      background: #000;
      border-color: #222;
    }
    .btn-apple:hover {
      background: #111;
      border-color: #333;
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 4px 0 18px;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: #0a1628;
      color: var(--text);
      font-size: 0.95rem;
      margin-bottom: 14px;
      outline: none;
    }
    input:focus {
      border-color: var(--blue-bright);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }
    input::placeholder { color: #64748b; }
    .row-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.82rem;
    }
    .row-between a {
      color: var(--cyan-soft);
      text-decoration: none;
    }
    .check-label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      font-weight: 500;
      color: var(--text);
      font-size: 0.82rem;
      cursor: pointer;
    }
    .check-label input {
      accent-color: var(--blue);
      width: auto;
      margin: 0;
    }
    .btn-primary {
      width: 100%;
      padding: 12px;
      background: var(--gradient);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 0.95rem;
      font-weight: 650;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }
    .btn-primary:hover { opacity: 0.95; }
    .footer-text {
      text-align: center;
      margin-top: 22px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .footer-text a {
      color: var(--cyan-soft);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <div class="logo-box">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="160" height="38" aria-label="m23">
          <defs>
            <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#2563eb"/>
              <stop offset="50%" stop-color="#0ea5e9"/>
              <stop offset="100%" stop-color="#06b6d4"/>
            </linearGradient>
          </defs>
          <g fill="url(#g)">
            <path d="M4 8 L36 8 L32 40 L0 40 Z"/>
            <path d="M42 8 L74 8 L70 40 L38 40 Z" opacity="0.9"/>
            <path d="M80 8 L112 8 L108 40 L76 40 Z" opacity="0.75"/>
            <path d="M118 8 L150 8 L146 40 L114 40 Z" opacity="0.6"/>
            <path d="M156 8 L196 8 L192 40 L152 40 Z" opacity="0.5"/>
          </g>
          <text x="100" y="30" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-weight="800" font-size="14" letter-spacing="2">m23</text>
        </svg>
      </div>
    </div>

    <h1>Ingresar</h1>

    <div class="social">
      <button class="btn-social" type="button">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path fill="#EA4335" d="M5.27 9.76A7.08 7.08 0 0 1 12 4.91c1.69 0 3.21.6 4.4 1.58L19.91 3C17.77 1.14 15.07 0 12 0 7.31 0 3.26 2.7 1.34 6.61l3.93 3.15z"/>
          <path fill="#34A853" d="M16.04 18.01A6.9 6.9 0 0 1 12 19.09a7.08 7.08 0 0 1-6.72-4.93l-3.94 3.12A11.96 11.96 0 0 0 12 24c2.93 0 5.73-1.07 7.83-3.06l-3.79-2.93z"/>
          <path fill="#4A90E2" d="M19.83 20.94A11.8 11.8 0 0 0 24 12c0-.74-.07-1.45-.2-2.14H12v4.55h6.92a6.2 6.2 0 0 1-2.55 3.66l3.46 2.87z"/>
          <path fill="#FBBC05" d="M5.28 14.16A7.2 7.2 0 0 1 4.91 12c0-.76.13-1.49.36-2.17L1.34 6.61A11.9 11.9 0 0 0 0 12c0 1.94.46 3.77 1.28 5.39l4-3.23z"/>
        </svg>
        Continuar con Google
      </button>

      <button class="btn-social btn-apple" type="button">
        <svg viewBox="0 0 24 24" fill="#fff" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
        </svg>
        Continuar con Apple
      </button>
    </div>

    <div class="divider">o con tu correo</div>

    <form onsubmit="event.preventDefault();">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" placeholder="tu@email.com" required autocomplete="email" />

      <label for="password">Contraseña</label>
      <input id="password" type="password" placeholder="••••••••" required autocomplete="current-password" />

      <div class="row-between">
        <label class="check-label">
          <input type="checkbox" /> Recordarme
        </label>
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>

      <button class="btn-primary" type="submit">Ingresar con correo</button>
    </form>

    <p class="footer-text">
      ¿No tienes cuenta? <a href="#">Regístrate con email</a>
    </p>
  </div>
</body>
</html>
